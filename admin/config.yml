backend:
name: git-gateway
branch: master

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
- name: "posts"
label: "Makaleler"
folder: "_posts"
create: true
slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
fields:
- {label: "Başlık", name: "title", widget: "string"}
- {label: "Tarih", name: "date", widget: "datetime"}
- {label: "İçerik", name: "body", widget: "markdown"}
